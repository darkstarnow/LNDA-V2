[package]
name = "leonida-tasks"
description = "Repository policy checks, format table installation and Windows setup."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
autobins = false
autotests = false
autoexamples = false
autobenches = false

[[bin]]
name = "leonida-tasks"
path = "Source/Main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
walkdir.workspace = true
sha2 = "0.10.9"

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
] }

[lints]
workspace = true
