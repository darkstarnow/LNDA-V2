[package]
name = "leonida-services"
description = "Our implementation of the Xbox system API surface the title imports."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
autobins = false
autotests = false
autoexamples = false
autobenches = false

[lib]
path = "Source/Lib.rs"

[[test]]
name = "no_dll_planting"
path = "Tests/NoDllPlanting.rs"

[dependencies]
leonida-core.workspace = true
leonida-graphics.workspace = true
leonida-loader.workspace = true
leonida-image.workspace = true
leonida-formats.workspace = true
opus-pure.workspace = true
zlib-rs.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
hidapi = { version = "2.6.7", default-features = false, features = ["windows-native"] }
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Media",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Power",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_XboxController",
    "Win32_UI_WindowsAndMessaging",
] }
windows = { workspace = true, optional = true, features = [
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Variant",
] }
windows-core = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true

[features]
diagnostics = ["leonida-graphics/diagnostics", "leonida-loader/diagnostics", "dep:windows", "dep:windows-core"]

[lints]
workspace = true
